name: drink_water
description: "Hydration and medicine reminders that work entirely on-device."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local notifications + exact alarm scheduling (survives app being closed).
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1

  # On-device persistence. No backend involved.
  shared_preferences: ^2.5.3

  # Reports
  fl_chart: ^1.0.0

  # JSON export / import
  file_picker: ^10.3.3
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
