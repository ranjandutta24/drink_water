name: drink_water
description: "Hydration and medicine reminders that work entirely on-device."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local notifications + exact alarm scheduling (survives app being closed).
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1

  # On-device persistence. No backend involved.
  shared_preferences: ^2.5.3

  # Reports
  fl_chart: ^1.0.0

  # JSON export / import
  file_picker: ^10.3.3
  path_provider: ^2.1.5

  # Weekly and monthly report PDFs. Pure Dart, no platform code — the document is
  # laid out and rendered on device, so a report never leaves the phone unless the
  # user shares it.
  pdf: ^3.11.1

  # The Android share sheet, used for the report PDF and the hydration card.
  share_plus: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Bundled so the font picker works with no network and no runtime download.
  # Licence text ships alongside the files (OFL, one file per family).
  #
  # Plus Jakarta Sans, Inter and Manrope are offered by the picker but their
  # files are not in the repo yet — see assets/fonts/README.md. A family the
  # picker names but pubspec does not declare falls back to the platform font
  # rather than failing, so the app builds and runs either way; declaring an
  # asset that is missing from disk is what breaks the build, which is why
  # these three blocks stay commented until the files land.
  fonts:
    - family: Play
      fonts:
        - asset: assets/fonts/Play-Regular.ttf
        - asset: assets/fonts/Play-Bold.ttf
          weight: 700

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

    # - family: Plus Jakarta Sans
    #   fonts:
    #     - asset: assets/fonts/PlusJakartaSans-Regular.ttf
    #     - asset: assets/fonts/PlusJakartaSans-Medium.ttf
    #       weight: 500
    #     - asset: assets/fonts/PlusJakartaSans-Bold.ttf
    #       weight: 700

    # - family: Inter
    #   fonts:
    #     - asset: assets/fonts/Inter-Regular.ttf
    #     - asset: assets/fonts/Inter-Medium.ttf
    #       weight: 500
    #     - asset: assets/fonts/Inter-Bold.ttf
    #       weight: 700

    # - family: Manrope
    #   fonts:
    #     - asset: assets/fonts/Manrope-Regular.ttf
    #     - asset: assets/fonts/Manrope-Medium.ttf
    #       weight: 500
    #     - asset: assets/fonts/Manrope-Bold.ttf
    #       weight: 700
